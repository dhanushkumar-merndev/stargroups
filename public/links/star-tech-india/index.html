  <!-- Brand artwork is supplied by Star Tech India and stored in assets/. -->
  <style>
    * { box-sizing: border-box; }

    html { background: #000; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      background: #000 url('/links/star-tech-india/assets/background.webp') center / cover no-repeat;
    }

    main {
      width: min(400px, calc(100% - 48px));
      padding: 54px 0 30px;
    }

    header { text-align: center; }

    .logo {
      display: block;
      width: 128px;
      height: 128px;
      margin: 0 auto 12px;
      overflow: hidden;
      mix-blend-mode: screen;
      filter: drop-shadow(0 2px 2px #0008);
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 6.15vw, 30px);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: .6px;
      white-space: nowrap;
    }

    .tech { color: #f00000; }


    nav {
      display: grid;
      gap: 16px;
      margin-top: 44px;
    }

    .link {
      min-height: 71px;
      display: flex;
      align-items: center;
      padding: 10px 22px;
      border: 1px solid #737373;
      border-radius: 24px;
      background: linear-gradient(110deg, #000d, #080808d9 55%, #000e);
      box-shadow: inset 0 0 0 2px #ffffff09, 0 2px 7px #0004;
      color: #e6e6e6;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .link:hover { border-color: #d5d5d5; background-color: #202020; }
    .link:focus-visible { outline: 2px solid #fff; outline-offset: 5px; }

    .icon {
      width: 51px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-right: 22px;
      padding-right: 19px;
      border-right: 1px solid #ffffff30;
      box-sizing: content-box;
    }

    .icon svg { display: block; width: 42px; height: 42px; flex-shrink: 0; }
    .business-icon { display: block; width: 58px; height: 50px; object-fit: contain; flex-shrink: 0; }

    .label {
      flex: 1;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 3.2px;
    }

    .arrow { width: 12px; height: 20px; margin-left: 10px; flex-shrink: 0; }

    @media (max-width: 380px) {
      main { width: calc(100% - 36px); }
      .link { padding-inline: 17px; }
      .icon { width: 40px; padding-right: 14px; margin-right: 17px; }
      .label { font-size: 12px; letter-spacing: 2.4px; }
    }

    @media (max-height: 650px) {
      main { padding-top: 28px; padding-bottom: 28px; }
      .logo { width: 110px; height: 110px; }
      nav { margin-top: 30px; gap: 13px; }
      .link { min-height: 66px; }
    }
  </style>
