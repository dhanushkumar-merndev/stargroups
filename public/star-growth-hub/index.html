<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="description" content="Connect with Star Growth Hub. Find us on Google, visit our website, follow us on Instagram, or give us a call.">
  <title>Star Growth Hub | Connect With Us</title>
  <link rel="icon" href="/star-growth-hub/assets/favicon.ico" sizes="16x16 32x32 48x48 64x64" type="image/x-icon">
  <link rel="icon" href="/star-growth-hub/assets/favicon-32x32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/star-growth-hub/assets/favicon-16x16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="/star-growth-hub/assets/apple-touch-icon.png" sizes="180x180">
  <!-- Images are stored in assets/.
    Logo and Google Business icon prepared with the built-in ImageGen tool.
    Logo cleanup prompt: remove extraction artifacts, preserve the existing white
    star, red swoosh and STAR GROWTH HUB lettering; keep the background transparent.
    Business icon prompt: remove the exterior white background; preserve the blue
    storefront, striped awning and opaque white G; output a transparent PNG.
    Background generated with the built-in ImageGen tool.
    Prompt: Use case: photorealistic-natural. Asset type: website background texture.
    Primary request: create a subtle black charcoal stone-paper texture similar to
    the supplied Star Growth Hub reference: fine rough grain, gently mottled dark
    concrete, soft illumination in the center and nearly black vignette edges.
    Composition: flat front-facing surface filling the entire portrait 3:4 canvas.
    Palette: neutral black and charcoal gray only, very dark overall, understated
    fine detail for white text overlaid later in HTML. Constraints: BACKGROUND
    TEXTURE ONLY, absolutely no text, letters, logos, stars, icons, buttons, border,
    people, objects or watermark. It will sit behind four HTML link buttons.
  -->
  <style>
    * { box-sizing: border-box; }

    html { background: #0b0b0b; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(#0003, #0003), url('/star-growth-hub/assets/background.webp') center / cover;
    }

    main {
      width: min(400px, calc(100% - 48px));
      padding: 54px 0 30px;
    }

    header { text-align: center; }

    .logo {
      display: block;
      width: 128px;
      height: 128px;
      margin: 0 auto 12px;
      object-fit: cover;
      object-position: left;
      /* Show the star mark from the horizontal logo image. */
      clip-path: polygon(0 0, 93% 0, 93% 35%, 83% 35%, 83% 100%, 0 100%);
      filter: drop-shadow(0 2px 2px #0008);
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 6.15vw, 30px);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: .6px;
      white-space: nowrap;
    }

    .growth { color: #ed090c; }

    .tagline {
      margin: 6px 0 0;
      color: #bdbdbd;
      font-size: clamp(9px, 2.45vw, 12px);
      line-height: 1.5;
      letter-spacing: 2.8px;
      white-space: nowrap;
    }

    nav {
      display: grid;
      gap: 16px;
      margin-top: 44px;
    }

    .link {
      min-height: 71px;
      display: flex;
      align-items: center;
      padding: 10px 22px;
      border: 1px solid #737373;
      border-radius: 24px;
      background: linear-gradient(110deg, #000d, #080808d9 55%, #000e);
      box-shadow: inset 0 0 0 2px #ffffff09, 0 2px 7px #0004;
      color: #e6e6e6;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .link:hover { border-color: #d5d5d5; background-color: #202020; }
    .link:focus-visible { outline: 2px solid #fff; outline-offset: 5px; }

    .icon {
      width: 51px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-right: 22px;
      padding-right: 19px;
      border-right: 1px solid #ffffff30;
      box-sizing: content-box;
    }

    .icon svg { display: block; width: 42px; height: 42px; flex-shrink: 0; }
    .business-icon { display: block; width: 58px; height: 50px; object-fit: contain; flex-shrink: 0; }

    .label {
      flex: 1;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 3.2px;
    }

    .arrow { width: 12px; height: 20px; margin-left: 10px; flex-shrink: 0; }

    @media (max-width: 380px) {
      main { width: calc(100% - 36px); }
      .link { padding-inline: 17px; }
      .icon { width: 40px; padding-right: 14px; margin-right: 17px; }
      .label { font-size: 12px; letter-spacing: 2.4px; }
      .tagline { letter-spacing: 2px; }
    }

    @media (max-height: 650px) {
      main { padding-top: 28px; padding-bottom: 28px; }
      .logo { width: 110px; height: 110px; }
      nav { margin-top: 30px; gap: 13px; }
      .link { min-height: 66px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <img class="logo" src="/star-growth-hub/assets/logo.png" alt="" width="128" height="128" aria-hidden="true">
      <h1>STAR <span class="growth">GROWTH</span> HUB</h1>
      <p class="tagline">GROW BRANDS. BUILD BUSINESSES.</p>
    </header>

    <nav aria-label="Connect with Star Growth Hub">
      <a class="link" href="https://share.google/X5IzhcA0ZwJYK0jRL" target="_blank" rel="noopener noreferrer" aria-label="Find Star Growth Hub on Google Business (opens in a new tab)">
        <span class="icon" aria-hidden="true"><img class="business-icon" src="/star-growth-hub/assets/google-business.png" width="58" height="50" alt=""></span>
        <span class="label">GOOGLE BUSINESS</span>
        <svg class="arrow" viewBox="0 0 12 20" fill="none" aria-hidden="true"><path d="m3 4 5 6-5 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>

      <a class="link" href="https://stargrowthhub.in" target="_blank" rel="noopener noreferrer" aria-label="Visit stargrowthhub.in (opens in a new tab)">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" stroke="#dedede" stroke-width="2.3">
            <circle cx="24" cy="24" r="20"/>
            <ellipse cx="24" cy="24" rx="9" ry="20"/>
            <path d="M24 4v40M4 24h40M8 12c9 6 23 6 32 0M8 36c9-6 23-6 32 0"/>
          </svg>
        </span>
        <span class="label">WEBSITE</span>
        <svg class="arrow" viewBox="0 0 12 20" fill="none" aria-hidden="true"><path d="m3 4 5 6-5 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>

      <a class="link" href="https://www.instagram.com/star_growthhub/" target="_blank" rel="noopener noreferrer" aria-label="Follow @star_growthhub on Instagram (opens in a new tab)">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <defs>
              <radialGradient id="instagram" cx="28%" cy="100%" r="110%">
                <stop offset="0" stop-color="#ffdb73"/>
                <stop offset=".28" stop-color="#ff9a30"/>
                <stop offset=".5" stop-color="#f42f73"/>
                <stop offset=".75" stop-color="#b62dcc"/>
                <stop offset="1" stop-color="#5751d8"/>
              </radialGradient>
            </defs>
            <rect x="1" y="1" width="46" height="46" rx="12" fill="url(#instagram)"/>
            <rect x="9.5" y="9.5" width="29" height="29" rx="8.5" fill="none" stroke="#fff" stroke-width="3"/>
            <circle cx="24" cy="24" r="7" fill="none" stroke="#fff" stroke-width="3"/>
            <circle cx="33.3" cy="14.8" r="2" fill="#fff"/>
          </svg>
        </span>
        <span class="label">INSTAGRAM</span>
        <svg class="arrow" viewBox="0 0 12 20" fill="none" aria-hidden="true"><path d="m3 4 5 6-5 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>

      <a class="link" href="tel:+919606952972" aria-label="Call Star Growth Hub on +91 9606952972">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="24" r="21" stroke="#f0f0f0" stroke-width="2.6"/>
            <path d="M16.6 11.8c.7-.3 1.6 0 1.9.8l2.5 5.8c.3.6.1 1.3-.4 1.8l-2.4 2.1c1.7 3.6 4.4 6.2 8 7.8l2-2.5c.4-.5 1.2-.7 1.8-.4l5.7 2.7c.7.3 1.1 1.1.8 1.8l-.8 2.8c-.4 1.3-1.7 2.1-3 2C21.2 35.4 12.5 26.7 11.3 16c-.1-1.3.6-2.5 1.8-3l3.5-1.2Z" fill="#f5f5f5"/>
          </svg>
        </span>
        <span class="label">CALL US</span>
        <svg class="arrow" viewBox="0 0 12 20" fill="none" aria-hidden="true"><path d="m3 4 5 6-5 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </nav>
  </main>
</body>
</html>
